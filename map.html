<style>
  :root {

  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--paper); color:var(--ink); font-family:'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

  .top-rule { height:3px; background:var(--red); position:fixed; top:0; left:0; width:100%; z-index:1100; }

  nav { position:fixed; top:3px; width:100%; background:var(--paper); border-bottom:1px solid var(--rule-dark);
    padding:0 48px; height:56px; display:flex; justify-content:space-between; align-items:center; z-index:1000; }
  .nav-logo { font-family:'Shippori Mincho',serif; font-size:20px; font-weight:600; letter-spacing:0.08em;
    color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:10px; }
  .nav-logo .sep { color:var(--red); font-size:14px; font-weight:400; }
  .nav-logo .sub { font-family:'Noto Serif JP',serif; font-size:12px; font-weight:400; color:var(--ink-soft); letter-spacing:0.1em; }
  .nav-links { display:flex; gap:26px; list-style:none; }
  .nav-links a { font-size:12px; letter-spacing:0.06em; color:var(--ink-soft); text-decoration:none;
    transition:color 0.2s; border-bottom:1px solid transparent; padding-bottom:2px; }
  .nav-links a:hover, .nav-links a.active { color:var(--ink); border-bottom-color:var(--rule-dark); }
  .lang-switcher { display:flex; align-items:center; gap:0; border:1px solid var(--rule-dark); }
  .lang-btn { background:none; border:none; font-size:10px; letter-spacing:0.15em; color:var(--ink-soft);
    cursor:pointer; padding:5px 10px; font-family:'Noto Sans KR',sans-serif; transition:all 0.15s; border-right:1px solid var(--rule-dark); }
  .lang-btn:last-child { border-right:none; }
  .lang-btn:hover { background:var(--paper-2); color:var(--ink); }
  .lang-btn.active { background:var(--ink); color:var(--paper); }

  .page-header { padding:120px 48px 30px; border-bottom:1px solid var(--rule-dark);
    display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; }
  .header-eyebrow { font-size:10px; letter-spacing:0.35em; text-transform:uppercase; color:var(--red);
    margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .header-eyebrow::before { content:''; display:inline-block; width:16px; height:1px; background:var(--red); }
  .header-title { font-family:'Shippori Mincho',serif; font-size:clamp(34px,4.8vw,56px); font-weight:600;
    line-height:1.1; letter-spacing:0.02em; color:var(--ink); }
  .header-title em { color:var(--red); font-style:italic; font-family:'IM Fell English',serif; font-weight:400; }
  .header-desc { font-family:'Noto Serif KR',serif; font-size:14px; line-height:1.8; color:var(--ink-soft);
    font-weight:400; margin-top:16px; grid-column:1; }
  .header-meta { text-align:right; }
  .header-meta .count { font-family:'Shippori Mincho',serif; font-size:44px; font-weight:700; color:var(--ink); line-height:1; display:block; }
  .header-meta .count em { color:var(--red); font-style:normal; }
  .header-meta .count-label { font-size:11px; color:var(--ink-soft); letter-spacing:0.12em; display:block; margin-top:4px; }

  /* 지도 영역 */
  .map-wrap { position:relative; }
  #map { width:100%; height:calc(100vh - 220px); min-height:480px; background:var(--paper-2); z-index:1; }

  /* 범례 */
  .legend { position:absolute; top:16px; right:16px; z-index:500; background:rgba(245,242,236,0.95);
    border:1px solid var(--rule-dark); padding:14px 16px; font-size:12px; max-width:200px; }
  .legend-title { font-family:'Shippori Mincho',serif; font-size:13px; color:var(--ink); margin-bottom:10px;
    padding-bottom:8px; border-bottom:1px solid var(--rule); letter-spacing:0.04em; }
  .legend-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; cursor:pointer; color:var(--ink-mid); transition:color .15s; }
  .legend-row:hover { color:var(--ink); }
  .legend-row .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  .legend-row .ct { margin-left:auto; color:var(--ink-soft); font-family:'IM Fell English',serif; }
  .legend-note { margin-top:10px; padding-top:8px; border-top:1px solid var(--rule); font-size:10px; color:var(--ink-soft); line-height:1.5; }

  /* 핀 팝업 */
  .leaflet-popup-content-wrapper { border-radius:2px; background:var(--paper); border:1px solid var(--ink); box-shadow:0 6px 24px rgba(0,0,0,.18); }
  .leaflet-popup-content { margin:14px 16px; font-family:'Noto Sans KR',sans-serif; }
  .leaflet-popup-tip { background:var(--paper); border:1px solid var(--ink); }
  .pop-region { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--red); margin-bottom:5px; }
  .pop-name { font-family:'Shippori Mincho',serif; font-size:16px; font-weight:600; color:var(--ink); line-height:1.35; margin-bottom:3px; }
  .pop-ja { font-family:'Noto Serif JP',serif; font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .pop-link { display:inline-flex; align-items:center; gap:6px; font-size:12px; letter-spacing:0.02em;
    color:var(--ink-mid); text-decoration:none; border:1px solid var(--rule-dark); padding:7px 13px; transition:all .2s; }
  .pop-link:hover { border-color:var(--ink); color:var(--ink); background:var(--paper-2); }
  .pop-link .pin { color:var(--red); }

  /* 커스텀 마커(원형 도트) */
  .gp-marker { border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }

  @media(max-width:768px){
    nav { padding:0 16px; }
    .nav-links { display:none; }
    .nav-logo .sub { display:none; }
    .page-header { padding:96px 16px 24px; grid-template-columns:1fr; }
    .header-meta { text-align:left; }
    .header-meta .count { font-size:34px; }
    #map { height:calc(100vh - 250px); }
    .legend { top:auto; bottom:16px; right:16px; max-width:160px; padding:11px 13px; }
  }
</style>

  ];

  // 지역 그룹 색상 + 라벨(한/일/영)
  var GROUPS = {
    hokkaido:{color:"#3a6b8a", ko:"홋카이도", ja:"北海道", en:"Hokkaido"},
    kanto:   {color:"#8b2020", ko:"간토", ja:"関東", en:"Kanto"},
    chubu:   {color:"#9a7a2e", ko:"주부(후지)", ja:"中部(富士)", en:"Chubu (Fuji)"},
    kinki:   {color:"#5a7d4e", ko:"긴키", ja:"近畿", en:"Kinki"},
    chugoku: {color:"#7a5a8a", ko:"주고쿠", ja:"中国", en:"Chugoku"},
    shikoku: {color:"#b5793a", ko:"시코쿠", ja:"四国", en:"Shikoku"},
    kyushu:  {color:"#c0453a", ko:"규슈", ja:"九州", en:"Kyushu"}
  };

  var map = L.map('map', { scrollWheelZoom:true, zoomControl:true }).setView([35.4, 134.5], 5);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);

  var LANG = localStorage.getItem('mika-lang') || 'ja';
  var markers = [];

  function makeMarker(c){
    var col = (GROUPS[c.grp]||{}).color || "#8b2020";
    var icon = L.divIcon({
      className:'',
      html:'<div class="gp-marker" style="width:13px;height:13px;background:'+col+';"></div>',
      iconSize:[13,13], iconAnchor:[6,6], popupAnchor:[0,-8]
    });
    var m = L.marker([c.lat,c.lng],{icon:icon});
    m._course = c;
    m.bindPopup(popupHTML(c));
    return m;
  }

  function popupHTML(c){
    var g = GROUPS[c.grp]||{};
    var rlabel = g[LANG] || c.region;
    var name = (LANG==='ja') ? c.ja : c.ko;
    var dirLabel = {ko:'구글지도에서 열기',ja:'Googleマップで開く',en:'Open in Google Maps'}[LANG];
    var url = 'https://www.google.com/maps/search/'+encodeURIComponent(c.ja);
    var jaLine = (LANG==='ja') ? '' : '<div class="pop-ja">'+c.ja+'</div>';
    return '<div class="pop-region">'+c.region+'</div>'+
           '<div class="pop-name">'+name+'</div>'+ jaLine +
           '<a class="pop-link" href="'+url+'" target="_blank" rel="noopener"><span class="pin">📍</span>'+dirLabel+'</a>';
  }

  COURSES.forEach(function(c){ var m=makeMarker(c); m.addTo(map); markers.push(m); });

  // 범례 렌더
  function renderLegend(){
    var order = ['hokkaido','kanto','chubu','kinki','chugoku','shikoku','kyushu'];
    var counts = {};
    COURSES.forEach(function(c){ counts[c.grp]=(counts[c.grp]||0)+1; });
    var box = document.getElementById('legend-rows');
    box.innerHTML = '';
    order.forEach(function(g){
      if(!counts[g]) return;
      var info = GROUPS[g];
      var row = document.createElement('div');
      row.className='legend-row';
      row.innerHTML = '<span class="dot" style="background:'+info.color+'"></span>'+
                      '<span class="lg-label">'+info[LANG]+'</span>'+
                      '<span class="ct">'+counts[g]+'</span>';
      box.appendChild(row);
    });
  }
  renderLegend();

  // 언어 전환
  function setLang(lang){
    LANG = lang;
    localStorage.setItem('mika-lang', lang);
    var map3 = {ko:0,ja:1,en:2};
    var btns = document.querySelectorAll('.lang-switcher .lang-btn');
    btns.forEach(function(b){ b.classList.remove('active'); });
    if(btns[map3[lang]]) btns[map3[lang]].classList.add('active');
    document.querySelectorAll('.nav-txt').forEach(function(el){
      var t=el.getAttribute('data-'+lang); if(t) el.textContent=t;
    });
    // guide 메뉴: 한국어(ko)일 때만 노출
    var _navGuide = document.getElementById('nav-guide');
    if (_navGuide) { _navGuide.style.display = (lang === 'ko') ? '' : 'none'; }
    document.documentElement.setAttribute('data-sitelang', lang);
    document.querySelectorAll('.txt-i18n').forEach(function(el){
      var t=el.getAttribute('data-'+lang); if(t!=null) el.innerHTML=t;
    });
    // 팝업 다시 바인딩
    markers.forEach(function(m){ m.setPopupContent(popupHTML(m._course)); });
    renderLegend();
  }
  setLang(LANG);
</script>
